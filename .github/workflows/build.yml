name: Cloud Build (云打包)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone Feather engine
        run: git clone --recursive --depth 1 https://github.com/khcrysalis/Feather.git engine

      - name: Set bundle ID
        working-directory: engine
        run: |
          find . -name '*.pbxproj' -exec perl -pi -e 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = com.cert.account.t260901214911;/g' {} +

      - name: Build unsigned app
        working-directory: engine
        run: |
          xcodebuild -project Feather.xcodeproj -scheme Feather -configuration Release -destination "generic/platform=iOS" -derivedDataPath build -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO

      - name: Prepare Payload
        working-directory: engine
        run: |
          mkdir -p _build/Payload
          APP=$(find build/Build/Products -maxdepth 1 -name '*.app' | head -1)
          echo "found app: $APP"
          cp -R "$APP" _build/Payload/Feather.app
          chmod -R 0755 _build/Payload/Feather.app
          codesign --force --sign - --timestamp=none _build/Payload/Feather.app

      - name: Decode certificate and profile
        run: |
          echo "$CERT_P12" | base64 --decode > cert.p12
          base64 --decode provision/provision.b64 > profile.mobileprovision
          ls -la cert.p12 profile.mobileprovision
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}

      - name: Import certificate to keychain
        run: |
          security create-keychain -p build /tmp/build.keychain
          security default-keychain -s /tmp/build.keychain
          security unlock-keychain -p build /tmp/build.keychain
          security import cert.p12 -k /tmp/build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k build /tmp/build.keychain
          security find-identity -v -p codesigning
        env:
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}

      - name: Extract entitlements
        run: |
          openssl smime -inform DER -verify -noverify -in profile.mobileprovision -out profile.plist
          python3 -c "import plistlib; d=plistlib.load(open('profile.plist','rb')); plistlib.dump(d['Entitlements'], open('entitlements.plist','wb'), fmt=plistlib.FMT_XML)"

      - name: Sign with certificate
        run: |
          cp profile.mobileprovision engine/_build/Payload/Feather.app/embedded.mobileprovision
          /usr/bin/codesign --force --deep -s "Apple Distribution: Terry Peppers (2TAD594A66)" --entitlements entitlements.plist engine/_build/Payload/Feather.app
          /usr/bin/codesign -vv engine/_build/Payload/Feather.app

      - name: Package SwiftSign.ipa
        run: |
          ditto -c -k --sequesterRsrc --keepParent engine/_build/Payload SwiftSign.ipa
          ls -la SwiftSign.ipa

      - name: Create manifest.plist
        run: |
          cat > manifest.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key><string>software-package</string>
                              <key>url</key><string>https://github.com/hjm98-rgb/SwiftSign/releases/download/latest/SwiftSign.ipa</string>
                          </dict>
                      </array>
                      <key>metadata</key>
                      <dict>
                          <key>bundle-identifier</key><string>com.cert.account.t260901214911</string>
                          <key>bundle-version</key><string>1.0.0</string>
                          <key>kind</key><string>software</string>
                          <key>title</key><string>SwiftSign</string>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

      - name: Publish latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest SwiftSign.ipa manifest.plist --title "SwiftSign 最新版" --notes "云端打包并用证书签名"
